name: Build and Release

# Triggers:
#   - Pushing a tag like v1.2.3 → builds the plugin (stamped with that
#     version), zips it with proper folder structure, and creates a GitHub
#     Release with both the loose DLL and the zip attached.
#   - Manual run from the Actions tab → CI build only, uploads the DLL as a
#     workflow artifact you can download. Useful for testing without tagging.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      asf_version:
        description: 'ArchiSteamFarm release to build against (e.g. 6.3.5.1)'
        required: false
        default: '6.3.5.1'

env:
  # Bump these when you target a newer ASF / .NET. Keep in sync with the
  # README's compatibility note. Manual workflow_dispatch can override ASF.
  ASF_VERSION: '6.3.5.1'
  DOTNET_VERSION: '10.0.x'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to attach files to a release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve ASF version
        id: asf
        run: |
          set -euo pipefail
          VERSION="${{ inputs.asf_version }}"
          if [ -z "$VERSION" ]; then VERSION="$ASF_VERSION"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building against ArchiSteamFarm $VERSION"

      - name: Download ArchiSteamFarm ${{ steps.asf.outputs.version }} runtime
        env:
          AV: ${{ steps.asf.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p ASF
          curl --fail --location --show-error --silent \
            -o asf-generic.zip \
            "https://github.com/JustArchiNET/ArchiSteamFarm/releases/download/${AV}/ASF-generic.zip"
          unzip -jo asf-generic.zip \
            ArchiSteamFarm.dll \
            SteamKit2.dll \
            protobuf-net.dll \
            protobuf-net.Core.dll \
            -d ASF
          ls -la ASF

      - name: Resolve plugin version from tag
        id: ver
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
            echo "version=${TAG_VERSION}" >> "$GITHUB_OUTPUT"
            echo "tag=v${TAG_VERSION}" >> "$GITHUB_OUTPUT"
            echo "Resolved version from tag: ${TAG_VERSION}"
          else
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"
            echo "tag=manual" >> "$GITHUB_OUTPUT"
            echo "No tag — manual run, version comes from csproj."
          fi

      - name: Build plugin
        env:
          ASF_DIR: ${{ github.workspace }}/ASF
          PLUGIN_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "${PLUGIN_VERSION}" != "0.0.0" ]]; then
            # Stamp the assembly with the tag version (e.g. 1.2.3 → 1.2.3.0).
            dotnet publish src/ASF-AutoAchievement.csproj \
              --configuration Release \
              --output publish \
              --nologo \
              -p:Version="${PLUGIN_VERSION}.0"
          else
            dotnet publish src/ASF-AutoAchievement.csproj \
              --configuration Release \
              --output publish \
              --nologo
          fi
          ls -la publish/ASF-AutoAchievement.dll

      - name: Compute MD5 of built DLL
        id: md5
        run: |
          set -euo pipefail
          MD5=$(md5sum publish/ASF-AutoAchievement.dll | cut -d' ' -f1 | tr 'a-z' 'A-Z')
          echo "md5=${MD5}" >> "$GITHUB_OUTPUT"
          echo "DLL MD5: ${MD5}"

      - name: Build a convenience zip alongside the loose DLL
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          # Lay out the file in the proper plugin subdirectory so the zip
          # extracts cleanly into <ASF>/plugins/.
          mkdir -p stage/ASF-AutoAchievement
          cp publish/ASF-AutoAchievement.dll stage/ASF-AutoAchievement/
          (cd stage && zip -r "../ASF-AutoAchievement-${TAG}.zip" ASF-AutoAchievement)
          ls -la "ASF-AutoAchievement-${TAG}.zip"

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASF-AutoAchievement
          path: publish/ASF-AutoAchievement.dll
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/ASF-AutoAchievement.dll
            ASF-AutoAchievement-${{ steps.ver.outputs.tag }}.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Install

            1. Download `ASF-AutoAchievement.dll` from the assets below (or the convenience zip if you prefer to extract directly into `<ASF>/plugins/`).
            2. Drop `ASF-AutoAchievement.dll` into `<ASF>/plugins/ASF-AutoAchievement/`.
            3. Add to any bot config under `<ASF>/config/<BotName>.json`:
               ```json
               "AutoAchievement": { "Enabled": true }
               ```
            4. Restart ASF.

            See the [README](https://github.com/sturq/ASF-AutoAchievement#readme) for the full command list and configuration options.

            ## Compatibility

            Built against ArchiSteamFarm **${{ steps.asf.outputs.version }}** (`net10.0`). Likely loads on neighboring 6.3.x patch releases; for other major ASF versions, build from source.

            ## Verification

            | File | MD5 |
            |---|---|
            | `ASF-AutoAchievement.dll` | `${{ steps.md5.outputs.md5 }}` |

            ---
