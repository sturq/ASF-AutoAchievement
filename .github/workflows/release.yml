name: Build and Release

# Triggers:
#   - Push to main → reads the latest v* tag, bumps patch by 1, builds the
#     plugin (stamped with that version), tags the commit, and creates a
#     GitHub Release with the loose DLL + a convenience zip attached.
#     Skips when only docs / workflow files / config changed.
#   - Manual run from the Actions tab → same flow, optional version override
#     for emergencies. Useful if you want to skip ahead (e.g. force v1.1.0).
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - 'config.example.json'
      - '.github/**'
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Force a specific version (e.g. 1.1.0). Leave blank to auto-bump patch.'
        required: false
        default: ''
      asf_version:
        description: 'ArchiSteamFarm release to build against (e.g. 6.3.5.1)'
        required: false
        default: '6.3.5.1'

# Bump these when you target a newer ASF / .NET. Keep in sync with the
# README's compatibility note.
env:
  ASF_VERSION: '6.3.5.1'
  DOTNET_VERSION: '10.0.x'

# Serialize runs so two near-simultaneous pushes don't both compute the same
# "next version" and race to create the same tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create tags + attach release assets

    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need all tags so the auto-bump can find the latest

      - name: Set up .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve ASF version
        id: asf
        run: |
          set -euo pipefail
          VERSION="${{ inputs.asf_version }}"
          if [ -z "$VERSION" ]; then VERSION="$ASF_VERSION"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building against ArchiSteamFarm $VERSION"

      - name: Compute next plugin version
        id: ver
        env:
          OVERRIDE: ${{ inputs.version_override }}
        run: |
          set -euo pipefail

          if [ -n "$OVERRIDE" ]; then
            NEXT="$OVERRIDE"
            echo "Using manual override: v${NEXT}"
          else
            # Find the highest existing semver tag of the form vMAJOR.MINOR.PATCH.
            LATEST=$(git tag -l 'v*' --sort=-v:refname | head -n 1)

            if [ -z "$LATEST" ]; then
              # No tags yet → start at 1.0.0.
              NEXT="1.0.0"
              echo "No existing v* tags. Starting at v${NEXT}."
            else
              STRIPPED="${LATEST#v}"
              if [[ ! "$STRIPPED" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                echo "Latest tag '$LATEST' isn't a plain vMAJOR.MINOR.PATCH — bailing." >&2
                exit 1
              fi
              MAJOR="${BASH_REMATCH[1]}"
              MINOR="${BASH_REMATCH[2]}"
              PATCH="${BASH_REMATCH[3]}"
              NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))"
              echo "Latest tag: ${LATEST}. Next version: v${NEXT}."
            fi
          fi

          # Refuse to overwrite an existing tag — if a release for v$NEXT
          # already exists, the user needs to bump explicitly via override.
          if git rev-parse "v${NEXT}" >/dev/null 2>&1; then
            echo "Tag v${NEXT} already exists. Use the workflow_dispatch override to pick a different version." >&2
            exit 1
          fi

          echo "version=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEXT}" >> "$GITHUB_OUTPUT"

      - name: Download ArchiSteamFarm ${{ steps.asf.outputs.version }} runtime
        env:
          AV: ${{ steps.asf.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p ASF
          curl --fail --location --show-error --silent \
            -o asf-generic.zip \
            "https://github.com/JustArchiNET/ArchiSteamFarm/releases/download/${AV}/ASF-generic.zip"
          unzip -jo asf-generic.zip \
            ArchiSteamFarm.dll \
            SteamKit2.dll \
            protobuf-net.dll \
            protobuf-net.Core.dll \
            -d ASF
          ls -la ASF

      - name: Build plugin
        env:
          ASF_DIR: ${{ github.workspace }}/ASF
          PLUGIN_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          dotnet publish src/ASF-AutoAchievement.csproj \
            --configuration Release \
            --output publish \
            --nologo \
            -p:Version="${PLUGIN_VERSION}.0"
          ls -la publish/ASF-AutoAchievement.dll

      - name: Compute MD5 of built DLL
        id: md5
        run: |
          set -euo pipefail
          MD5=$(md5sum publish/ASF-AutoAchievement.dll | cut -d' ' -f1 | tr 'a-z' 'A-Z')
          echo "md5=${MD5}" >> "$GITHUB_OUTPUT"
          echo "DLL MD5: ${MD5}"

      - name: Build a convenience zip alongside the loose DLL
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p stage/ASF-AutoAchievement
          cp publish/ASF-AutoAchievement.dll stage/ASF-AutoAchievement/
          (cd stage && zip -r "../ASF-AutoAchievement-${TAG}.zip" ASF-AutoAchievement)
          ls -la "ASF-AutoAchievement-${TAG}.zip"

      - name: Tag the release commit
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "sturq"
          git config user.email "sturq@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          files: |
            publish/ASF-AutoAchievement.dll
            ASF-AutoAchievement-${{ steps.ver.outputs.tag }}.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Install

            1. Download `ASF-AutoAchievement.dll` from the assets below (or the convenience zip if you prefer to extract directly into `<ASF>/plugins/`).
            2. Drop `ASF-AutoAchievement.dll` into `<ASF>/plugins/ASF-AutoAchievement/`.
            3. Add to any bot config under `<ASF>/config/<BotName>.json`:
               ```json
               "AutoAchievement": { "Enabled": true }
               ```
            4. Restart ASF.

            See the [README](https://github.com/sturq/ASF-AutoAchievement#readme) for the full command list and configuration options.

            ## Compatibility

            Built against ArchiSteamFarm **${{ steps.asf.outputs.version }}** (`net10.0`). Likely loads on neighboring 6.3.x patch releases; for other major ASF versions, build from source.

            ## Verification

            | File | MD5 |
            |---|---|
            | `ASF-AutoAchievement.dll` | `${{ steps.md5.outputs.md5 }}` |

            ---
