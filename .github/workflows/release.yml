name: Build and Release

# Triggers:
#   - Pushing a tag like v1.2.3 → builds the plugin and attaches the DLL to
#     the matching GitHub Release (creating one if it doesn't exist yet).
#   - Manual run from the Actions tab → CI build only, uploads the DLL as a
#     workflow artifact you can download. Useful for testing without a tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      asf_version:
        description: 'ArchiSteamFarm release to build against (e.g. 6.3.5.1)'
        required: false
        default: '6.3.5.1'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to attach files to a release
    env:
      # Bump this when you target a newer ASF release. Keep in sync with the
      # README's compatibility note. Manual workflow_dispatch can override.
      DEFAULT_ASF_VERSION: '6.3.5.1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve ASF version
        id: asf
        run: |
          VERSION="${{ inputs.asf_version }}"
          if [ -z "$VERSION" ]; then VERSION="$DEFAULT_ASF_VERSION"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building against ArchiSteamFarm $VERSION"

      - name: Download ASF reference assemblies
        env:
          ASF_VERSION: ${{ steps.asf.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p ASF
          curl --fail --location --show-error --silent \
            -o asf-generic.zip \
            "https://github.com/JustArchiNET/ArchiSteamFarm/releases/download/${ASF_VERSION}/ASF-generic.zip"
          unzip -jo asf-generic.zip \
            ArchiSteamFarm.dll \
            SteamKit2.dll \
            protobuf-net.dll \
            protobuf-net.Core.dll \
            -d ASF
          ls -la ASF

      - name: Build plugin
        env:
          ASF_DIR: ${{ github.workspace }}/ASF
        run: |
          dotnet publish src/ASF-AutoAchievement.csproj \
            --configuration Release \
            --output publish \
            --nologo

      - name: Verify build output
        run: |
          ls -la publish/ASF-AutoAchievement.dll
          du -h publish/ASF-AutoAchievement.dll

      - name: Upload workflow artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: ASF-AutoAchievement
          path: publish/ASF-AutoAchievement.dll
          if-no-files-found: error
          retention-days: 30

      - name: Attach DLL to GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/ASF-AutoAchievement.dll
          fail_on_unmatched_files: true
